<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d0d" />
  <title>Ping Pong | Desktop</title>
  <link rel="stylesheet" href="css/desktop.css" />
  <script src="js/game-desktop.js" defer></script>
</head>
<body>
  <h1>Ping Pong</h1>

  <div id="scoreboard" aria-label="Placar" aria-live="polite">
    <div class="score-block">
      <span class="score-label" id="label-left">JOGADOR</span>
      <span id="score-left">0</span>
    </div>
    <span class="score-separator" aria-hidden="true">:</span>
    <div class="score-block">
      <span class="score-label" id="label-right">CPU</span>
      <span id="score-right">0</span>
    </div>
  </div>

  <main id="game-container">
    <canvas
      id="game-canvas"
      width="1196"
      height="610"
      role="application"
      aria-label="Mesa de ping pong. Use W e S ou o mouse para mover a raquete esquerda."
    ></canvas>

    <div id="overlay" class="menu-active">
      <div id="countdown" class="hidden" role="status" aria-live="assertive">3</div>
      <div id="winner-message" class="hidden" role="status" aria-live="assertive"></div>
      <div id="ready-overlay" class="hidden">
        <span class="control-cue" aria-hidden="true">
          <svg viewBox="0 0 40 52">
            <g class="cursor-glyph">
              <path d="M7 8v36l9-9 8 17 7-4-8-16h13L7 8Z"></path>
            </g>
          </svg>
        </span>
        <button id="start-prompt" type="button">Clique para começar</button>
      </div>

      <section id="start-menu" role="dialog" aria-modal="true" aria-labelledby="menu-title">
        <h2 id="menu-title" class="menu-title">Ping Pong The Game</h2>

        <div class="menu-screen is-active" data-menu-screen="mainMenu">
          <div class="menu-actions">
            <button class="menu-btn primary" id="play-menu" type="button">Jogar</button>
            <button class="menu-btn" id="settings-menu" type="button">Configurações</button>
          </div>
        </div>

        <div class="menu-screen" data-menu-screen="playMenu" hidden>
          <h3>Escolha o modo de jogo</h3>
          <p>O jogo começa após 3 segundos</p>
          <div class="menu-actions">
            <button class="menu-btn" id="menu-1p" type="button">1 Jogador</button>
            <button class="menu-btn" id="menu-2p" type="button">2 Jogadores</button>
            <button class="menu-btn back-btn" type="button" data-menu-back>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 12H5"></path>
                <path d="m12 19-7-7 7-7"></path>
              </svg>
              <span>Voltar</span>
            </button>
          </div>
        </div>

        <div class="menu-screen" data-menu-screen="difficultyMenu" hidden>
          <h3>Escolha a dificuldade</h3>
          <div class="menu-actions">
            <button class="menu-btn" type="button" data-difficulty="easy">Fácil</button>
            <button class="menu-btn" type="button" data-difficulty="medium">Médio</button>
            <button class="menu-btn" type="button" data-difficulty="pro">Pro</button>
            <button class="menu-btn back-btn" type="button" data-menu-back="playMenu">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 12H5"></path>
                <path d="m12 19-7-7 7-7"></path>
              </svg>
              <span>Voltar</span>
            </button>
          </div>
        </div>

        <div class="menu-screen settings-menu-screen" data-menu-screen="settingsMenu" hidden>
          <h3>Configurações</h3>
          <fieldset class="setting-group">
            <legend>Pontos para vencer</legend>
            <div class="segmented-control" role="group" aria-label="Pontos para vencer">
              <button type="button" data-winning-score="3" aria-pressed="false">3</button>
              <button type="button" data-winning-score="5" aria-pressed="false">5</button>
              <button type="button" data-winning-score="7" aria-pressed="false">7</button>
              <button type="button" data-winning-score="10" aria-pressed="false">10</button>
            </div>
          </fieldset>
          <div class="menu-actions settings-actions">
            <button class="menu-btn back-btn" type="button" data-menu-back>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 12H5"></path>
                <path d="m12 19-7-7 7-7"></path>
              </svg>
              <span>Voltar</span>
            </button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <nav id="controls" aria-label="Controles da partida">
    <button id="btn-menu" type="button">Menu</button>
    <button id="btn-pause" type="button" disabled>Pausar</button>
    <button id="btn-reset" type="button">Reiniciar</button>
    <button id="btn-settings" type="button">Configurações</button>
  </nav>

  <p class="hint" id="hint">W / S ou Mouse - mover raquete</p>
  <p id="msg" role="status" aria-live="polite">Escolha o modo de jogo</p>
</body>
</html>
