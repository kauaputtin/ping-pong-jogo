<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ping Pong — Mobile</title>
  <link rel="stylesheet" href="css/mobile.css" />
</head>
<body>

  <h1>Ping Pong</h1>

  <div id="game-frame">
    <div id="center-col">
      <div id="field-row">
        <div id="score-row" aria-label="Placar">
          <div class="side-score" id="side-left">
            <span class="score-label" id="label-left">JOGADOR</span>
            <span class="score" id="score-left">0</span>
          </div>

          <div class="score-sep" aria-hidden="true">:</div>

          <div class="side-score" id="side-right">
            <span class="score-label" id="label-right">CPU</span>
            <span class="score" id="score-right">0</span>
          </div>
        </div>

        <div id="field">
          <canvas id="game-canvas"></canvas>

          <div id="touch-guide" class="hidden" aria-hidden="true">
            <div class="guide-row guide-p1">
              <span class="guide-arrow">&lsaquo;</span>
              <span class="guide-label">JOGADOR 1</span>
              <span class="guide-arrow">&rsaquo;</span>
            </div>
            <div class="guide-row guide-p2">
              <span class="guide-arrow">&lsaquo;</span>
              <span class="guide-label">JOGADOR 2</span>
              <span class="guide-arrow">&rsaquo;</span>
            </div>
          </div>

          <div id="overlay">
            <div id="countdown" class="hidden">3</div>

            <div id="start-menu">
              <div class="menu-header">
                <h2>Ping Pong The Game</h2>
                <button id="settings-toggle" class="icon-btn" type="button" aria-label="Configurações" aria-expanded="false">
                  &#9881;
                </button>
              </div>

              <div id="settings-panel" class="settings-panel hidden">
                <div class="setting-group">
                  <h3>Velocidade da bola:</h3>
                  <div class="option-row" role="group" aria-label="Velocidade da bola">
                    <button class="option-btn" type="button" data-setting="ballSpeed" data-value="slow">Lenta</button>
                    <button class="option-btn active" type="button" data-setting="ballSpeed" data-value="normal">Normal</button>
                    <button class="option-btn" type="button" data-setting="ballSpeed" data-value="fast">Rápida</button>
                  </div>
                </div>

                <div class="setting-group">
                  <h3>Pontos para vencer:</h3>
                  <div class="option-row" role="group" aria-label="Pontos para vencer">
                    <button class="option-btn active" type="button" data-setting="winningScore" data-value="5">5</button>
                    <button class="option-btn" type="button" data-setting="winningScore" data-value="10">10</button>
                    <button class="option-btn" type="button" data-setting="winningScore" data-value="15">15</button>
                  </div>
                </div>

                <div class="setting-group">
                  <h3>Tipo de controle:</h3>
                  <div class="control-options" role="group" aria-label="Tipo de controle">
                    <button class="option-btn active" type="button" data-setting="controlType" data-value="drag">Arrastar a raquete com o dedo</button>
                    <button class="option-btn" type="button" data-setting="controlType" data-value="buttons">Botões na tela &uarr; &darr;</button>
                  </div>
                </div>
              </div>

              <p>O jogo começa após 3 segundos</p>
              <div class="menu-actions">
                <button class="menu-btn" id="menu-1p">1 Jogador</button>
                <button class="menu-btn" id="menu-2p">2 Jogadores</button>
              </div>
            </div>

            <div id="difficulty-menu" class="hidden">
              <h2>Escolha o nível</h2>
              <div class="menu-actions">
                <button class="menu-btn" id="diff-easy">Fácil</button>
                <button class="menu-btn" id="diff-medium">Médio</button>
                <button class="menu-btn" id="diff-pro">Pro</button>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div id="controls">
    <button id="btn-menu" onclick="GameMobile.openMenu()">Menu</button>
    <button id="btn-pause" onclick="GameMobile.togglePause()" disabled>Pausar</button>
    <button id="btn-reset" onclick="GameMobile.reset()">Reiniciar</button>
    <button id="btn-difficulty" class="hidden" onclick="GameMobile.openDifficultyMenu()">Dificuldade</button>
  </div>

  <div id="touch-buttons" class="hidden" aria-label="Botões de controle">
    <button id="touch-up" type="button" aria-label="Mover para cima">&uarr;</button>
    <button id="touch-down" type="button" aria-label="Mover para baixo">&darr;</button>
  </div>

  <p class="hint" id="hint">Toque para mover a raquete</p>
  <p id="msg">Escolha o modo de jogo</p>

  <script src="js/game-mobile.js"></script>
  <script>
    // Resize canvas to fit window
    let resizeFrame = null;

    function scheduleResizeCanvas() {
      if (resizeFrame) cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(resizeCanvas);
    }

    function resizeCanvas() {
      resizeFrame = null;
      const canvas = document.getElementById('game-canvas');
      const field = document.getElementById('field');
      const h1 = document.querySelector('h1');
      const controls = document.getElementById('controls');
      
      // Aspect ratio original do canvas (ajustar conforme necessário)
      const aspectRatio = 380 / 640;
      
      const viewportHeight = window.visualViewport?.height || window.innerHeight;
      const headerHeight = h1?.offsetHeight || 40;
      const footerHeight = (controls?.offsetHeight || 40) + 48;
      const availableHeight = Math.max(260, viewportHeight - headerHeight - footerHeight);
      const availableWidth = Math.min(window.innerWidth - 16, 520);
      
      // Calcular tamanho máximo
      let width = availableWidth;
      let height = width / aspectRatio;
      
      if (height > availableHeight) {
        height = availableHeight;
        width = height * aspectRatio;
      }
      
      // Usar CSS para redimensionar
      field.style.width = width + 'px';
      field.style.height = height + 'px';
      
      // Manter proporção do canvas
      canvas.style.width = '100%';
      canvas.style.height = '100%';
    }
    
    window.addEventListener('resize', scheduleResizeCanvas);
    window.visualViewport?.addEventListener('resize', scheduleResizeCanvas);
    window.addEventListener('load', resizeCanvas);
    resizeCanvas();
  </script>

</body>
</html>
