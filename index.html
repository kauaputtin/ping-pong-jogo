<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ping Pong | The Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: #0d0d0d;
    }

    #game-frame {
      display: block;
      width: 100dvw;
      height: 100dvh;
      border: 0;
    }
  </style>
</head>
<body>
  <noscript style="display: block; padding: 16px; color: #fff; font-family: Segoe UI, sans-serif;">
    Ative o JavaScript para jogar.
  </noscript>

  <iframe id="game-frame" title="Ping Pong"></iframe>

  <script>
    (() => {
      const frame = document.getElementById('game-frame');
      const frameTitles = {
        'pt-BR': { mobile: 'Ping Pong para celular', desktop: 'Ping Pong para desktop' },
        en: { mobile: 'Ping Pong for mobile', desktop: 'Ping Pong for desktop' },
        es: { mobile: 'Ping Pong para móvil', desktop: 'Ping Pong para escritorio' }
      };
      const mobileUserAgent = navigator.userAgentData?.mobile === true ||
        /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      const coarsePointer = window.matchMedia('(pointer: coarse)').matches;
      const compactScreen = Math.min(screen.width, screen.height) <= 1024;
      const useMobileVersion = mobileUserAgent || (coarsePointer && compactScreen);

      const normalizeLanguage = value => {
        if (value?.toLowerCase().startsWith('en')) return 'en';
        if (value?.toLowerCase().startsWith('es')) return 'es';
        return 'pt-BR';
      };

      let language = 'pt-BR';
      try {
        language = normalizeLanguage(window.localStorage.getItem('ping-pong-language'));
      } catch {
        // Portuguese remains the default when storage is unavailable.
      }

      const applyFrameLanguage = nextLanguage => {
        language = normalizeLanguage(nextLanguage);
        document.documentElement.lang = language;
        frame.title = frameTitles[language][useMobileVersion ? 'mobile' : 'desktop'];
      };

      frame.src = useMobileVersion ? 'ping_pong_mobile_v2.html' : 'ping_pong_desktop.html';
      applyFrameLanguage(language);

      window.addEventListener('message', event => {
        if (event.source === frame.contentWindow && event.data?.type === 'ping-pong-language') {
          applyFrameLanguage(event.data.language);
        }
      });
    })();
  </script>
</body>
</html>
